{{- if .Values.restart.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.restart.serviceAccount }}
  labels:
    {{- include "game-cronjob-gameinterface-restart.labels" . | nindent 4 }}
  {{- with .Values.restart.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "game-cronjob-gameinterface-restart.fullname" . }}
  labels:
    {{- include "game-cronjob-gameinterface-restart.labels" . | nindent 4 }}
rules:
  - apiGroups: 
      - apps
    resources: 
      - deployments
    resourceNames: 
      - game-gameinterface-avia
      - game-gameinterface-awc-service
      - game-gameinterface-bti-service
      - game-gameinterface-cards365
      - game-gameinterface-dg-service
      - game-gameinterface-endor-service
      - game-gameinterface-evolution-service
      - game-gameinterface-fachai
      - game-gameinterface-gkx
      - game-gameinterface-habanero-service
      - game-gameinterface-im
      - game-gameinterface-jdb-service
      - game-gameinterface-jili
      - game-gameinterface-joker
      - game-gameinterface-ky
      - game-gameinterface-ly
      - game-gameinterface-obet
      - game-gameinterface-pinnacle
      - game-gameinterface-pp
      - game-gameinterface-saba-service
      - game-gameinterface-sbo-service
      - game-gameinterface-sm01-service
      - game-gameinterface-sw-service
      - game-gameinterface-tfgaming-service
      - game-gameinterface-v8
      - game-gameinterface-wgfm-service
      - game-gameinterface-wgvia
      - game-gameinterface-wicketcricket
      - game-gameinterface-wmcasino-service
      - game-gameinterface-yeebet
    verbs: 
      - get
      - patch
      - list
      - watch 
    # "list" and "watch" are only needed
    # if you want to use `rollout status`
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "game-cronjob-gameinterface-restart.fullname" . }}
  labels:
    {{- include "game-cronjob-gameinterface-restart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "game-cronjob-gameinterface-restart.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.restart.serviceAccount }}
    namespace: {{ .Release.Namespace }}
subjects:
- kind: Group
  name: system:serviceaccount:{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}