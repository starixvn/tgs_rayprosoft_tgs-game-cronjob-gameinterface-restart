{{- if .Values.restart.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "game-cronjob-gameinterface-restart.fullname" . }}
spec:
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  schedule: '{{ .Values.restart.schedule }}'
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: {{ .Values.restart.serviceAccount }}
          restartPolicy: Never
          containers:
            - name: kubectl
              image: bitnami/kubectl
              command:
                - bash
                - -c
                - >-
                  kubectl rollout restart deployment -l tgs.game.kind=gameinterface &&
                  kubectl rollout status deployment -l tgs.game.kind=gameinterface
{{- end }}
