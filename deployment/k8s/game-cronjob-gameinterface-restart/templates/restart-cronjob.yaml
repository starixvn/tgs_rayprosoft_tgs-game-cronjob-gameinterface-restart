{{- if .Values.restart.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "game-cronjob-gameinterface-restart.fullname" . }}
spec:
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  schedule: '{{ .Values.restart.schedule }}'
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: {{ .Values.restart.serviceAccount }}
          restartPolicy: Never
          containers:
            - name: kubectl
              image: bitnami/kubectl
              command:
                - bash
                - -c
                - >-
                  kubectl rollout restart deployment/game-gameinterface-avia &&
                  kubectl rollout status deployment/game-gameinterface-avia 
                  kubectl rollout restart deployment/game-gameinterface-awc-service &&
                  kubectl rollout status deployment/game-gameinterface-awc-service 
                  kubectl rollout restart deployment/game-gameinterface-bti-service &&
                  kubectl rollout status deployment/game-gameinterface-bti-service 
                  kubectl rollout restart deployment/game-gameinterface-cards365 &&
                  kubectl rollout status deployment/game-gameinterface-cards365 
                  kubectl rollout restart deployment/game-gameinterface-dg-service &&
                  kubectl rollout status deployment/game-gameinterface-dg-service 
                  kubectl rollout restart deployment/game-gameinterface-endor-service &&
                  kubectl rollout status deployment/game-gameinterface-endor-service 
                  kubectl rollout restart deployment/game-gameinterface-evolution-service &&
                  kubectl rollout status deployment/game-gameinterface-evolution-service 
                  kubectl rollout restart deployment/game-gameinterface-fachai &&
                  kubectl rollout status deployment/game-gameinterface-fachai
                  kubectl rollout restart deployment/game-gameinterface-gkx &&
                  kubectl rollout status deployment/game-gameinterface-gkx
                  kubectl rollout restart deployment/game-gameinterface-habanero-service &&
                  kubectl rollout status deployment/game-gameinterface-habanero-service
                  kubectl rollout restart deployment/game-gameinterface-im &&
                  kubectl rollout status deployment/game-gameinterface-im
                  kubectl rollout restart deployment/game-gameinterface-jdb-service &&
                  kubectl rollout status deployment/game-gameinterface-jdb-service
                  kubectl rollout restart deployment/game-gameinterface-jili &&
                  kubectl rollout status deployment/game-gameinterface-jili
                  kubectl rollout restart deployment/game-gameinterface-joker &&
                  kubectl rollout status deployment/game-gameinterface-joker
                  kubectl rollout restart deployment/game-gameinterface-ky &&
                  kubectl rollout status deployment/game-gameinterface-ky
                  kubectl rollout restart deployment/game-gameinterface-ly &&
                  kubectl rollout status deployment/game-gameinterface-ly
                  kubectl rollout restart deployment/game-gameinterface-obet &&
                  kubectl rollout status deployment/game-gameinterface-obet
                  kubectl rollout restart deployment/game-gameinterface-pinnacle &&
                  kubectl rollout status deployment/game-gameinterface-pinnacle
                  kubectl rollout restart deployment/game-gameinterface-pp &&
                  kubectl rollout status deployment/game-gameinterface-pp
                  kubectl rollout restart deployment/game-gameinterface-saba-service &&
                  kubectl rollout status deployment/game-gameinterface-saba-service
                  kubectl rollout restart deployment/game-gameinterface-sbo-service &&
                  kubectl rollout status deployment/game-gameinterface-sbo-service
                  kubectl rollout restart deployment/game-gameinterface-sm01-service &&
                  kubectl rollout status deployment/game-gameinterface-sm01-service
                  kubectl rollout restart deployment/game-gameinterface-sw-service &&
                  kubectl rollout status deployment/game-gameinterface-sw-service
                  kubectl rollout restart deployment/game-gameinterface-tfgaming-service &&
                  kubectl rollout status deployment/game-gameinterface-tfgaming-service
                  kubectl rollout restart deployment/game-gameinterface-v8 &&
                  kubectl rollout status deployment/game-gameinterface-v8
                  kubectl rollout restart deployment/game-gameinterface-wgfm-service &&
                  kubectl rollout status deployment/game-gameinterface-wgfm-service
                  kubectl rollout restart deployment/game-gameinterface-wgvia &&
                  kubectl rollout status deployment/game-gameinterface-wgvia
                  kubectl rollout restart deployment/game-gameinterface-wicketcricket &&
                  kubectl rollout status deployment/game-gameinterface-wicketcricket
                  kubectl rollout restart deployment/game-gameinterface-wmcasino-service &&
                  kubectl rollout status deployment/game-gameinterface-wmcasino-service
                  kubectl rollout restart deployment/game-gameinterface-yeebet &&
                  kubectl rollout status deployment/game-gameinterface-yeebet
{{- end }}
